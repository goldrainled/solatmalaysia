<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Solat Display - JHR02</title>
<link rel="stylesheet" href="../styles.css" />
</head>
<body>

<!-- ===================== AUDIO ELEMENTS (REQUIRED FOR HUIDU) ===================== -->
<audio id="azanSubuh"
       src="https://raw.githubusercontent.com/goldrainled/solatmalaysia/main/azan/azan_subuh.mp3"
       preload="auto"></audio>

<audio id="azanNormal"
       src="https://raw.githubusercontent.com/goldrainled/solatmalaysia/main/azan/azan_normal.mp3"
       preload="auto"></audio>
<!-- ===================== END AUDIO ELEMENTS ===================== -->

<div class="slideshow-bg">
    <img src="../bg1.jpg">
    <img src="../bg2.jpg">
    <img src="../bg3.jpg">
    <img src="../bg4.jpg">
    <img src="../bg5.jpg">
</div>

<div id="viewportHost">
<div id="app" class="app-root">
<div class="scroll-area">

<div class="header-area">
    <div id="dateTodayG" class="header-row">Loading date...</div>
    <div id="dateTodayH" class="header-row">Loading Hijri...</div>
    <div id="zoneName" class="header-row location-row">Loading zone...</div>
</div>

<div class="card">
  <div class="card-title">Waktu Sekarang</div>
  <div id="currentTime" class="time-big">--:--:--</div>
</div>

<div class="card card-current">
  <div id="currentPrayerName" class="time-label">--</div>
  <div id="currentPrayerTime" class="time-medium">--:--</div>
</div>

<div class="card">
  <div class="card-title">Menuju</div>
  <div id="nextPrayerNameLarge" class="time-big">--</div>
</div>

<div class="section-title">Waktu Solat Seterusnya</div>
<div class="countdown-container">
  <div class="count-item"><div id="cdHour" class="count-number">00</div><div class="count-text">JAM</div></div>
  <div class="count-item"><div id="cdMin" class="count-number">00</div><div class="count-text">MINIT</div></div>
  <div class="count-item"><div id="cdSec" class="count-number">00</div><div class="count-text">SAAT</div></div>
</div>

<div id="cardImsak" class="prayer-row"><span>Imsak</span><span id="imsakTime">--:--</span></div>
<div id="cardSubuh" class="prayer-row"><span>Subuh</span><span id="subuhTime">--:--</span></div>
<div id="cardSyuruk" class="prayer-row"><span>Syuruk</span><span id="syurukTime">--:--</span></div>
<div id="cardZohor" class="prayer-row"><span>Zohor</span><span id="zohorTime">--:--</span></div>
<div id="cardAsar" class="prayer-row"><span>Asar</span><span id="asarTime">--:--</span></div>
<div id="cardMaghrib" class="prayer-row"><span>Maghrib</span><span id="maghribTime">--:--</span></div>
<div id="cardIsyak" class="prayer-row"><span>Isyak</span><span id="isyakTime">--:--</span></div>

</div>
</div>
</div>

<script>
  window.SELECTED_ZONE = "JHR02";
</script>

<script src="../main.js"></script>

<!-- ===================== AZAN LOGIC (HUIDU SAFE) ===================== -->
<script>
(function(){

  const zone = "JHR02";

  const audioMap = {
    subuh: document.getElementById("azanSubuh"),
    normal: document.getElementById("azanNormal"),
    fri1: document.getElementById("azanNormal")
  };

  let prayTimes = {};
  let playedToday = {};
  let today = getDateString();

  function getDateString(d = new Date()){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  async function loadPrayerTimes(){
    try{
      const res = await fetch(
        `https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=today&zone=${zone}`
      );
      const json = await res.json();
      const p = json.prayerTime[0];

      prayTimes = {
        subuh: p.subuh,
        zohor: p.zohor,
        asar: p.asr,
        maghrib: p.maghrib,
        isyak: p.isyak
      };

      if (getDateString() !== today){
        today = getDateString();
        playedToday = {};
      }
    } catch(e){
      console.error(e);
    }
  }

  function playAudio(key){
    try{
      const a = audioMap[key];
      a.currentTime = 0;
      a.play();
    }catch(e){
      console.error("Audio error", e);
    }
  }

  function minusMinutes(hhmmss, min){
    let [h,m,s] = hhmmss.split(":").map(Number);
    let t = h*3600 + m*60 + s - min*60;
    if (t < 0) t += 86400;
    return `${String(Math.floor(t/3600)).padStart(2,"0")}:${String(Math.floor(t%3600/60)).padStart(2,"0")}:00`;
  }

  function tick(){
    if (!prayTimes.zohor) return;

    const now = new Date();
    const cur = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    const day = now.getDay(); // Friday = 5

    if (!playedToday.subuh && cur === prayTimes.subuh.substring(0,5)){
      playedToday.subuh = true;
      playAudio("subuh");
    }

    if (day !== 5 && !playedToday.zohor && cur === prayTimes.zohor.substring(0,5)){
      playedToday.zohor = true;
      playAudio("normal");
    }

    if (day === 5){
      const fri1 = minusMinutes(prayTimes.zohor,30).substring(0,5);
      if (!playedToday.fri1 && cur === fri1){
        playedToday.fri1 = true;
        playAudio("fri1");
      }
      if (!playedToday.fri2 && cur === prayTimes.zohor.substring(0,5)){
        playedToday.fri2 = true;
        playAudio("normal");
      }
    }

    if (!playedToday.asar && cur === prayTimes.asar.substring(0,5)){
      playedToday.asar = true;
      playAudio("normal");
    }

    if (!playedToday.maghrib && cur === prayTimes.maghrib.substring(0,5)){
      playedToday.maghrib = true;
      playAudio("normal");
    }

    if (!playedToday.isyak && cur === prayTimes.isyak.substring(0,5)){
      playedToday.isyak = true;
      playAudio("normal");
    }
  }

  loadPrayerTimes();
  setInterval(loadPrayerTimes, 300000);
  setInterval(tick, 1000);

})();
</script>
<!-- ===================== END AZAN ===================== -->

</body>
</html>
